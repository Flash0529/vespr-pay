# VESPR on your own computer: the shared server, the AI agent and two SDE logins (alice and bob), all on localhost. Needs Docker and a Nebius Token Factory key.
#   ./make-env.sh            (random tokens; reads NEBIUS_API_KEY from the environment or a nebius.env file)
#   docker compose up -d --build
#   then open the two links in links.txt (two browser windows: you see both people and the agent in one file)
name: vespr-local
x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
services:
  collab:
    <<: *hardening
    build: ../../server
    user: "1000:1000"
    ports: ["127.0.0.1:8241:8241"]
    environment: { MURMIO_SUGGEST_UPSTREAM: "http://agent-coder:8242/suggest" }
    volumes: [ "collab-data:/data", "./tokens:/run/secrets/murmio-tokens:ro" ]
  agent-coder:
    <<: *hardening
    build: ../../agents
    user: "1000:1000"
    mem_limit: 1536m
    environment:
      MURMIO_SERVER: ws://collab:8241
      MURMIO_ROOM: demo
      MURMIO_TOKEN: "${TOKEN_AGENT}"
      AGENT_NAME: coder
      MURMIO_HUMAN_RUNS: "${MURMIO_HUMAN_RUNS:-1}"   # the app's Run button: your own computer, so on; set 0 to switch it off
      NEBIUS_API_KEY: "${NEBIUS_API_KEY:-}"       # empty: the agent runs a scripted demo mode and says so
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      MURMIO_PUBLIC_URL: "http://localhost:8241"    # where your browser reaches the server: previews are served under it
      MURMIO_TOKEN_CAP: "${MURMIO_TOKEN_CAP:-0}"      # AI tokens per 24 h; 0 = no limit
    volumes: [ "./tokens:/run/secrets/murmio-tokens:ro" ]
    depends_on: [collab]
  ide-alice: &ide
    <<: *hardening
    build: ../../ide
    mem_limit: 1536m
    ports: ["127.0.0.1:3001:3000"]
    environment: { MURMIO_USER: alice, MURMIO_TOKEN: "${TOKEN_ALICE}", IDE_TOKEN: "${IDE_TOKEN_ALICE}", MURMIO_ROOM: demo }
    volumes: [ "../../extensions/murmio-collab:/ext-src:ro", "../../sample-project:/sample:ro", "ws-alice:/workspace" ]
    depends_on: [collab]
  ide-bob:
    <<: *ide
    ports: ["127.0.0.1:3002:3000"]
    environment: { MURMIO_USER: bob, MURMIO_TOKEN: "${TOKEN_BOB}", IDE_TOKEN: "${IDE_TOKEN_BOB}", MURMIO_ROOM: demo }
    volumes: [ "../../extensions/murmio-collab:/ext-src:ro", "../../sample-project:/sample:ro", "ws-bob:/workspace" ]
volumes: { collab-data: {}, ws-alice: {}, ws-bob: {} }
